# The growth workflow end to end (RFC-0001 S4): connect Search Console and
# GitHub, detect, review, prepare, open a pull request and track it. Google and
# GitHub are faked in the worker (src/server/e2e/growthProviderFake.ts).
name: E2E growth workflow

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: e2e-growth-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-growth:
    # Playwright 1.59 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The browser download is the step that fails on a bad CDN day (and the
      # one with a multi-minute tail when it does not). The cache key is the
      # exact Playwright version, so a browser upgrade always re-downloads.
      - name: Restore the Chromium download
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # 111 migrations through wrangler take about 40 seconds and depend only
      # on the SQL files, the binding and the wrangler version, so the applied
      # state is cached under all three. A miss just replays them.
      - name: Restore the migrated local D1 state
        id: d1-cache
        uses: actions/cache/restore@v4
        with:
          path: .wrangler/state/v3/d1
          key: d1-local-${{ runner.os }}-${{ hashFiles('drizzle/sqlite/**', 'wrangler.jsonc', 'pnpm-lock.yaml') }}

      - name: Migrate the local D1 database
        if: steps.d1-cache.outputs.cache-hit != 'true'
        run: pnpm db:migrate:local

      # Saved here, not at the end of the job: the spec writes the growth
      # workflow's rows into this database, and a cache holding one run's rows
      # would change what the next run sees.
      - name: Save the migrated local D1 state
        if: steps.d1-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .wrangler/state/v3/d1
          key: ${{ steps.d1-cache.outputs.cache-primary-key }}

      # The worker reads AUTH_MODE from .env.local, as in local development.
      # A shell variable reaches only the client build.
      - name: Use local no-auth mode
        run: printf 'AUTH_MODE=local_noauth\n' > .env.local

      - name: Run the growth workflow spec
        run: pnpm exec playwright test -c tests/playwright.growth.config.ts
        env:
          PLAYWRIGHT_CHANNEL: chromium

      - name: Upload the failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-growth-results
          path: test-results/
          retention-days: 7
