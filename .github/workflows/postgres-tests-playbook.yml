name: Postgres real-SQL tests (Playbook)

permissions:
  contents: read

# The suites that exercise real SQL run on in-memory SQLite in the main unit
# job. This workflow runs the same files against a real Postgres, as RFC-0007
# asks, because a passing SQLite run is not evidence about Postgres.
#
# Which files those are is discovered by scripts/ci-postgres-suites.mjs rather
# than listed here: the list this workflow used to carry had fallen 21 suites
# behind, including all three billing spend suites.
#
# Each shard gets its own Postgres service container, so the suites that race
# on shared rows (see .agents/PAPERCUTS.md) cannot reach each other's data.
# Within a shard, files still run one at a time for the same reason.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: postgres-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: postgres shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openseo_test
          POSTGRES_DB: openseo_growth_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openseo_test -d openseo_growth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The suites accept only a disposable localhost/openseo_growth_test.
      OPPORTUNITY_TEST_PG_URL: postgres://openseo_test@127.0.0.1:5432/openseo_growth_test
      SHARD_COUNT: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Postgres migrations
        run: pnpm db:migrate:pg
        env:
          POSTGRES_DATABASE_URL: ${{ env.OPPORTUNITY_TEST_PG_URL }}

      # The script fails if the import closure returns a suspiciously short
      # list, so a broken closure cannot quietly shrink what Postgres checks.
      - name: Find the real-SQL suites
        run: |
          node scripts/ci-postgres-suites.mjs > suites.txt
          echo "Shard ${{ matrix.shard }} of ${{ env.SHARD_COUNT }}, from $(wc -l < suites.txt | tr -d ' ') real-SQL suites." \
            >> "$GITHUB_STEP_SUMMARY"

      # One file at a time within the shard: these suites share this shard's
      # database and race on shared rows (.agents/PAPERCUTS.md). Shards run in
      # parallel instead, each against its own container.
      - name: Run this shard against Postgres
        run: >-
          pnpm exec vitest run $(cat suites.txt)
          --shard=${{ matrix.shard }}/${{ env.SHARD_COUNT }}
          --no-file-parallelism
          --reporter=dot
          --reporter=github-actions

  # The status check the deploy gate waits for. Keep this job id `postgres`:
  # a matrix job reports one check per shard, and no single `postgres` context.
  postgres:
    if: always()
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to have succeeded
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "Postgres shards: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          [ "$RESULT" = success ] || {
            echo "::error::A Postgres shard did not succeed ($RESULT)."
            exit 1
          }
