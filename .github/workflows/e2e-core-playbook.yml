# Core app flows end to end: pages load cleanly at desktop and phone width,
# and save flows keep input and name the problem. No provider keys needed.
name: E2E core flows

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: e2e-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-core:
    # Playwright 1.59 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The browser download is the step that fails on a bad CDN day (and the
      # one with a multi-minute tail when it does not). The cache key is the
      # exact Playwright version, so a browser upgrade always re-downloads.
      - name: Restore the Chromium download
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      # `--with-deps` shells out to apt, which is where this step's long tail
      # comes from: a 21 s median against a 522 s P95 and six outright
      # failures in the two weeks before it was cached, including one stall
      # observed on a cache hit, where the browser was already present and
      # only apt was left to run. Bound it and retry once rather than spend
      # the job's whole budget inside a stalled mirror.
      - name: Install Chromium
        run: |
          for attempt in 1 2; do
            if timeout 300 pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Chromium install attempt $attempt timed out or failed."
          done
          echo "::error::Could not install Chromium after two attempts."
          exit 1

      # 111 migrations through wrangler take about 40 seconds and depend only
      # on the SQL files, the binding and the wrangler version, so the applied
      # state is cached under all three. A miss just replays them.
      - name: Restore the migrated local D1 state
        id: d1-cache
        uses: actions/cache/restore@v4
        with:
          path: .wrangler/state/v3/d1
          # v2: entries written before the WAL checkpoint are not reusable.
          key: d1-local-v2-${{ runner.os }}-${{ hashFiles('drizzle/sqlite/**', 'wrangler.jsonc', 'pnpm-lock.yaml') }}

      - name: Migrate the local D1 database
        if: steps.d1-cache.outputs.cache-hit != 'true'
        run: |
          pnpm db:migrate:local
          # The migrations leave a 5.8 MB write-ahead log against a 2.1 MB
          # database. Cached as-is, replaying it on restore costs about what
          # replaying the migrations would have.
          node scripts/ci-checkpoint-d1.mjs

      # Saved here, not at the end of the job: the spec writes projects and
      # tracked domains into this database, and a cache holding one run's rows
      # would change what the next run sees.
      - name: Save the migrated local D1 state
        if: steps.d1-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .wrangler/state/v3/d1
          key: ${{ steps.d1-cache.outputs.cache-primary-key }}

      # The worker reads AUTH_MODE from .env.local, as in local development.
      # A shell variable reaches only the client build.
      - name: Use local no-auth mode
        run: printf 'AUTH_MODE=local_noauth\n' > .env.local

      - name: Run the core flows spec
        run: pnpm exec playwright test -c tests/playwright.core.config.ts
        env:
          PLAYWRIGHT_CHANNEL: chromium

      - name: Upload the failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-core-results
          path: test-results/
          retention-days: 7
